services:
  ollama:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 9G

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_OLLAMA_API_URL=/api
    depends_on:
      - ollama
    command: npm run dev

volumes:
  ollama_data:
